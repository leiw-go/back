# 本地开发用 Nacos（standalone 模式，免 MySQL）
#   启动：docker compose -f docker-compose.nacos.yml up -d
#   停止：docker compose -f docker-compose.nacos.yml down
#   控制台：http://localhost:8848/nacos  （默认 nacos / nacos）
#
# 与 application-dev.yml 配套使用：SPRING_PROFILES_ACTIVE=dev
services:
  nacos:
    # 国内网络走 daocloud mirror（docker.io 直连经常超时/被墙）
    image: docker.m.daocloud.io/nacos/nacos-server:v2.5.1
    container_name: local-nacos
    restart: unless-stopped
    ports:
      - "8848:8848"   # HTTP API / OpenAPI（Spring Cloud Nacos Client 用）
      - "9848:9848"   # gRPC（Nacos 2.x 客户端连接 / 配置推送长连接，2.x 起必须开）
    environment:
      MODE: standalone                     # 单节点模式，无需 MySQL
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
      TZ: Asia/Shanghai
      # 本地 dev 走无鉴权模式（embedded Derby + 不开 auth，最顺滑）。
      # 若想开鉴权，需要额外设 NACOS_AUTH_TOKEN，并手动 seed 一个 nacos 用户——太麻烦，不值当。
      # 真正像生产那样用 Nacos 时，应当启 MySQL + 鉴权 + 自建用户，不是这镜像能直接搞定的。