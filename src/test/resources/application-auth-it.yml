# AuthController 集成测试 profile。
# 与 application-test.yml 解耦：
#   - 不连接 MySQL/Nacos；
#   - 用 H2 in-memory 数据库替代生产环境的 MySQL；
#   - 关闭 Flyway，用 spring.sql.init 注入 H2 友好的 DDL + 种子数据；
#   - 仅在 AuthControllerIntegrationTests 上以 @ActiveProfiles("auth-it") 显式激活。
# 现有单元测试 (BCryptPasswordEncoderTests, AuthControllerUnitTests) 不受此 profile 影响。
# jwt.secret 不在此声明 —— 该字段视为敏感凭据，由 AuthControllerIntegrationTests 上的
# @DynamicPropertySource 在测试启动时按随机生成 base64 串注入，避免向仓库写入任何真实 HMAC 密钥。
jwt:
  expiration: ${JWT_EXPIRATION:86400000}
spring:
  datasource:
    url: jdbc:h2:mem:auth_it;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/h2-schema.sql
      data-locations: classpath:db/h2-data.sql
      continue-on-error: false
  flyway:
    enabled: false
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
        register-enabled: false
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false
