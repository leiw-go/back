server:
  port: 8888
  # 所有 HTTP 接口统一加上 /design 前缀,用于区分来自本服务的接口
  # 例如 AuthController 的 /api/auth/login 在外部访问为 /design/api/auth/login
  servlet:
    context-path: /design

spring:
  application:
    name: ProjectInfomationManage
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-version: "1"
    validate-on-migrate: true
    clean-disabled: true
  # Spring Cloud Alibaba 2023+ 需要显式 import Nacos 配置
  # dataId 必须带 file-extension 后缀，因为 file-extension 不会自动拼接到 import 中的 dataId
  # 敏感配置（datasource / jwt）由 Nacos 提供；sql.init 必须保持 never，数据库迁移由 Flyway 管理。
  # 默认 dataId 约定：${spring.application.name}-${spring.profiles.active}.yaml
  #
  # base 里提供完整 Nacos 配置，默认值按 dev 设计（localhost:8848，空凭证，对应本地 docker compose）。
  #   prod 覆盖：application-prod.yml（host.docker.internal:8848 + nacos/nacos）
  #   dev 不需要覆盖文件（继承 base 即可）
  config:
    import: "optional:nacos:ProjectInfomationManage-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}"
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        # Nacos 暂不可用时仍可启动（dev/CI 友好）
        fail-fast: false
        # 显式开启配置变更推送：Nacos Client 收到 ConfigService 变更后会发 RefreshEvent，
        # @RefreshScope Bean 接到事件后销毁重建。默认就是 true，这里只是表达意图。
        refresh-enabled: true
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.yaowenltd.projectinfomationmanage.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Actuator 暴露面控制：默认只开 health/info（健康/存活探针），
# 这里额外开 refresh —— 让运维能在不发重启的前提下强制刷新一次 Nacos 配置。
management:
  endpoints:
    web:
      exposure:
        include: refresh,health,info
  endpoint:
    refresh:
      access: read_only     # 默认就是 read_only，显式写出来防止被某个 yaml 关掉
    health:
      access: read_only
  info:
    env:
      enabled: false        # 关掉 info/env（暴露太多默认信息，不小心开可能被人扫描）

# ============================================================
# LLM 中转（OpenAI 兼容）配置
#   - provider 元数据 + api_key 走 DB（见 V2__add_llm_relay.sql），本节只放非敏感默认值
#   - 密钥走环境变量 LLM_ENCRYPT_KEY 注入（32 字节 base64），不入 git
#   - 不依赖 Nacos，修改后需重启生效
# ============================================================
llm:
  upstream:
    # 非流式调用上游 HTTP 超时（毫秒）；流式调用 read timeout 固定为 0（受上游 keepalive 控制）
    timeout-ms: ${LLM_UPSTREAM_TIMEOUT_MS:60000}
  encrypt:
    # 32 字节 base64 编码；dev 环境使用占位密钥，生产必须从环境变量 LLM_ENCRYPT_KEY 覆盖
    key: ${LLM_ENCRYPT_KEY:AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=}
  trace:
    # OpenTelemetry span 数据导出方式：
    #   logging —— 输出到 stdout（dev 调试友好）
    #   none    —— 不导出，只保留 in-memory span context（生产推荐，避免日志噪音）
    exporter: ${LLM_TRACE_EXPORTER:none}