# ============================================================
# prod profile —— 生产环境
#   本文件是生产配置的唯一来源（无外部配置中心）。
#   敏感值（datasource 凭据 / jwt 密钥）一律用 ${ENV:default} 占位，
#   由 Jenkins 参数或 Docker 环境变量注入；改配置需重启容器。
#   飞书 webhook 生产默认关闭，由部署平台注入。
# ============================================================

spring:
  datasource:
    # 启动必需配置由 Jenkins / Docker 注入
    url: ${DB_URL:jdbc:mysql://mysql:3306/project_info_manage?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf-8}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Root@123456}
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/data.sql,classpath:sql/data-user.sql
      continue-on-error: true

jwt:
  # 生产密钥必须由 Jenkins / Docker 环境变量提供，禁止写入仓库。
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}
# 飞书 webhook 生产默认关闭，由部署平台注入
feishu:
  webhook:
    url: ${FEISHU_WEBHOOK_URL:}
    enabled: ${FEISHU_WEBHOOK_ENABLED:false}
    timeout-ms: ${FEISHU_WEBHOOK_TIMEOUT_MS:3000}
    secret: ${FEISHU_WEBHOOK_SECRET:}