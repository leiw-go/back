# ============================================================
# dev profile —— 本地开发
#   本文件是 dev 环境配置的唯一来源（无外部配置中心）。
#   需要临时覆盖时用环境变量，参见各处的 ${ENV:default} 占位。
# ============================================================

spring:
  datasource:
    # dev 用 127.0.0.1（mysql-simple 容器把 3306 映射到宿主机）；
    # prod 在 application-prod.yml 用 mysql:3306
    url: jdbc:mysql://127.0.0.1:13306/project_info_manage?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/data.sql,classpath:sql/data-user.sql
      continue-on-error: true

# 飞书自定义机器人 webhook 配置（见 FeishuWebhookProperties）。
# dev 环境默认开启，便于本地联调推送
feishu:
  webhook:
    url: ${FEISHU_WEBHOOK_URL:https://open.feishu.cn/open-apis/bot/v2/hook/a13b74c9-3f18-4612-a4e7-79da95858857}
    enabled: ${FEISHU_WEBHOOK_ENABLED:true}
    timeout-ms: ${FEISHU_WEBHOOK_TIMEOUT_MS:3000}
    secret: ${FEISHU_WEBHOOK_SECRET:}

# jwt 本地兜底（生产由 JWT_SECRET 环境变量注入，见 application-prod.yml）
jwt:
  secret: YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY3ODkwYWJjZGVmZ2hpamtsbW5vcA==
  expiration: 86400000
